<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <title>
    RetailMan Game POS
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<div class="sidebar">

  <h2>
    🎮 GAME POS
  </h2>

  <button
    type="button"
    onclick="showPage('homePage')"
  >
    🏠 Home
  </button>

  <button
    type="button"
    onclick="showPage('sessionPage')"
  >
    🎮 Sessions
  </button>

  <button
    type="button"
    onclick="showPage('salesPage')"
  >
    💰 Sales
  </button>

  <button
    type="button"
    onclick="showPage('reportPage')"
  >
    📊 Reports
  </button>

  <button
    type="button"
    onclick="showPage('adminPage')"
  >
    ⚙️ Admin
  </button>

</div>

<div class="main">

  <!-- HOME -->

  <div
    id="homePage"
    class="page"
  >

    <h1>
      🎮 GAME CENTER POS
    </h1>

    <div class="card">

      <h2 id="income">
        Income: ₦0
      </h2>

    </div>

    <div class="card">

      <h2 id="profitDisplay">
        Profit: ₦0
      </h2>

    </div>

  </div>

  <!-- SESSION -->

  <div
    id="sessionPage"
    class="page"
    style="display:none;"
  >

    <h2>
      🎮 Sessions
    </h2>

    <div class="card">

      <input
        id="station"
        placeholder="Station"
        autocomplete="off"
      >

      <input
        id="pricePerGame"
        type="number"
        min="1"
        placeholder="Price Per Game"
        autocomplete="off"
      >

      <input
        id="gameMinutes"
        type="number"
        min="1"
        placeholder="Game Minutes"
        autocomplete="off"
      >

      <input
        id="customerMinutes"
        type="number"
        min="1"
        placeholder="Customer Minutes"
        autocomplete="off"
      >

      <button
        type="button"
        onclick="startSession()"
      >
        Start Session
      </button>

    </div>

    <div
      id="sessionContainer"
    ></div>

  </div>

  <!-- SALES -->

  <div
    id="salesPage"
    class="page"
    style="display:none;"
  >

    <h2>
      💰 Sales
    </h2>

    <div class="card">

      <h3>
        📦 Products
      </h3>

      <input
        id="productName"
        placeholder="Product Name"
        autocomplete="off"
      >

      <!-- COST PRICE -->

      <input
        id="productCostPrice"
        type="number"
        min="1"
        placeholder="Cost Price"
        autocomplete="off"
      >

      <!-- SELLING PRICE -->

      <input
        id="productPrice"
        type="number"
        min="1"
        placeholder="Selling Price"
        autocomplete="off"
      >

      <!-- QUANTITY -->

      <input
        id="productQty"
        type="number"
        min="1"
        placeholder="Quantity"
        autocomplete="off"
      >

      <button
        type="button"
        onclick="addProduct()"
      >
        Add Product
      </button>

      <div
        id="productContainer"
      ></div>

    </div>

    <!-- SALES HISTORY -->

    <div class="card">

      <h3>
        🧾 Sales History
      </h3>

      <div
        id="salesHistory"
      ></div>

    </div>

  </div>

  <!-- REPORT -->

  <div
    id="reportPage"
    class="page"
    style="display:none;"
  >

    <div class="card">

      <h2>
        📊 Summary
      </h2>

      <div
        id="summaryPanel"
      ></div>

    </div>

  </div>

  <!-- ADMIN -->

  <div
    id="adminPage"
    class="page"
    style="display:none;"
  >

    <!-- LOGIN -->

    <div class="card">

      <h2>
        🔐 Login
      </h2>

      <input
        type="password"
        id="pinInput"
        placeholder="Admin Password"
        autocomplete="off"
      >

      <button
        type="button"
        onclick="login()"
      >
        Login
      </button>

      <p id="roleDisplay">
        Role: cashier
      </p>

    </div>

    <!-- ADMIN CONTROLS -->

    <div
      class="card"
      id="adminControls"
      style="display:none;"
    >

      <h2>
        ⚙️ Admin Controls
      </h2>

      <button
        type="button"
        class="danger"
        onclick="factoryReset()"
      >
        🧨 Factory Reset
      </button>

      <hr>

      <!-- CHANGE PASSWORD -->

      <h3>
        🔐 Change Password
      </h3>

      <input
        type="password"
        id="oldPassword"
        placeholder="Old Password"
        autocomplete="off"
      >

      <input
        type="password"
        id="newPassword"
        placeholder="New Password"
        autocomplete="off"
      >

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
        autocomplete="off"
      >

      <button
        type="button"
        onclick="changePassword()"
      >
        Change Password
      </button>

    </div>

  </div>

</div>

<script src="renderer.js"></script>

</body>
</html>
