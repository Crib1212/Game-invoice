<!DOCTYPE html>
<html>
<head>
  <title>Game Center POS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🎮 GAME CENTER POS SYSTEM</h1>

<!-- ================= LOGIN ================= -->
<h3>🔐 Login</h3>

<input id="pinInput" type="password" placeholder="Enter Admin PIN">
<button onclick="login()">Login</button>

<p id="roleDisplay">Role: cashier</p>

<hr>

<!-- ================= SESSION ================= -->
<h3>🎮 Game Session</h3>

<input id="station" placeholder="Station">
<input id="pricePerGame" type="number" placeholder="Price per Game (₦)">
<input id="gameMinutes" type="number" placeholder="Game Minutes">
<input id="customerMinutes" type="number" placeholder="Customer Minutes">

<button onclick="startSession()">Start Session</button>

<h3 id="income">Income: ₦0</h3>

<hr>

<!-- ================= PURCHASE ================= -->
<h3>🛒 Purchase</h3>

<input id="customerName" placeholder="Product Name">
<input id="itemName" placeholder="Item">
<input id="purchasePrice" type="number" placeholder="Price">
<input id="qty" type="number" value="1">

<button onclick="addPurchase()">Add Purchase</button>

<hr>

<!-- ================= FILTER ================= -->
<h3>📅 Date Filter</h3>

<input type="date" id="startDate">
<input type="date" id="endDate">

<button onclick="applyDateFilter()">Apply</button>
<button onclick="clearFilter()">Clear</button>

<hr>

<!-- ================= PRINT OPTIONS ================= -->
<h3>🖨 Print Options</h3>

<input type="date" id="printDate">

<button onclick="printSelectedDate()">Print Selected Date</button>
<button onclick="printAll()">Print All</button>
<button onclick="printSelected()">Print Selected Invoice</button>

<hr>

<!-- ================= SUMMARY ================= -->
<button onclick="toggleSummary()">📊 Summary</button>

<div id="summaryPanel"
  style="display:none;background:#111;color:white;padding:10px;border-radius:5px;">
</div>

<hr>

<!-- ================= ADMIN CONTROLS ================= -->
<h3>⚠️ Admin Controls</h3>

<div id="adminControls" style="display:none;">

  <button style="background:red;color:white;" onclick="factoryReset()">
    🧨 Factory Reset
  </button>

  <hr>

  <h4>🔐 Change Admin Password</h4>

  <input id="oldPin" type="password" placeholder="Old Password">
  <input id="newPin" type="password" placeholder="New Password">
  <input id="confirmPin" type="password" placeholder="Confirm Password">

  <button onclick="changeAdminPassword()">
    Change Password
  </button>

</div>

<hr>

<!-- ================= MAIN TABLE ================= -->
<div id="tableContainer"></div>

<!-- ================= SCRIPT ================= -->
<script src="renderer.js"></script>

</body>
</html>
